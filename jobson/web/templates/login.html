<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobsOn — Login</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #f1f5f9; }
  .card { background: #1e293b; padding: 2rem 2.25rem; border-radius: 14px; width: 100%; max-width: 360px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
  p.lead { margin: 0 0 1.5rem; color: #94a3b8; font-size: .9rem; }
  label { display: block; font-size: .85rem; margin: .75rem 0 .35rem; color: #cbd5e1; }
  input { width: 100%; padding: .65rem .8rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9; font-size: 1rem; box-sizing: border-box; }
  input:focus { outline: 2px solid #3b82f6; outline-offset: 0; border-color: transparent; }
  button { width: 100%; margin-top: 1.25rem; padding: .7rem; border-radius: 8px; border: 0; background: #3b82f6; color: white; font-weight: 600; font-size: 1rem; cursor: pointer; }
  button:hover { background: #2563eb; }
  .flash { margin: -.5rem 0 1rem; padding: .65rem .8rem; border-radius: 8px; background: #7f1d1d; color: #fecaca; font-size: .85rem; }
  .footer { margin-top: 1.25rem; font-size: .75rem; color: #64748b; text-align: center; }
</style>
</head>
<body>
<form class="card" method="post" action="{{ url_for('login_submit') }}">
  <h1>JobsOn</h1>
  <p class="lead">Acceso de revisor</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <label for="email">Email</label>
  <input id="email" name="email" type="email" required autofocus autocomplete="username">

  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" required autocomplete="current-password">

  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Entrar</button>

  <div class="footer">erecruit.ca · revisor de ofertas</div>
</form>
</body>
</html>
